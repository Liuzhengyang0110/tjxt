server:
  port: 8094  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: local
  application:
    name: aigc-service
  main:
    allow-circular-references: true # 允许循环引用
  servlet:
    multipart:
      max-file-size: 7MB
      max-request-size: 8MB
tj:
  swagger:
    enable: true
    package-path: com.tianji.aigc.controller
    title: 天机学堂 - AIGC接口文档
    description: 该服务包含AI相关功能
    contact-name: 传智教育·研究院
    contact-url: http://www.itcast.cn/
    contact-email: zhangzhijun@itcast.cn
    version: v1.0
    enableResponseWrap: true
  auth:
    resource:
      enable: true
  jdbc:
    database: tj_aigc #指定使用的数据库名
  ai:
    route:
      provider: LLM
      shadow-enabled: false
      fallback-enabled: true
      default-confidence-threshold: 0.85
      safe-default-agent: KNOWLEDGE
      confidence-thresholds: { }
    jev:
      enabled: true
      base-url: https://api.typesafe.ai
      api-key: ${JEV_API_KEY:}
      model: ${JEV_MODEL:jev-1.13.0}
      connect-timeout: 500ms
      read-timeout: 1200ms
      max-context-chars: 4000
      recent-message-limit: 8
      proxy:
        enabled: ${JEV_PROXY_ENABLED:false}
        host: ${JEV_PROXY_HOST:127.0.0.1}
        port: ${JEV_PROXY_PORT:7890}
    dashscope:
      websocket-url: wss://dashscope.aliyuncs.com/api-ws/v1/inference
      tts:
        model: qwen-audio-3.0-tts-flash
        voice: longanhuan_v3.6
        response-format: mp3
        speed: 1.0
        timeout-ms: 120000
      asr:
        url: https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation
        model: qwen-audio-3.0-asr-flash
        format: wav
        language-hints:
          - zh
        max-file-size: 7MB
        timeout-ms: 120000
    prompt:
      system:
        chat:
          data-id: system-chat-message.txt
          group: DEFAULT_GROUP
          timeout-ms: 20000
        route-agent:
          data-id: route-agent-system-message.txt
        recommend-agent:
          data-id: recommend-agent-system-message.txt
        buy-agent:
          data-id: buy-agent-system-message.txt
        consult-agent:
          data-id: consult-agent-system-message.txt
        knowledge-agent:
          data-id: knowledge-agent-system-message.txt
        text:
          data-id: text-system-chat-message.txt
    memory:
      max: 100
      type: Redis # Redis / Mysql
    chat-type: ROUTE # ROUTE / ENHANCE / APP
    user-id: 9999
